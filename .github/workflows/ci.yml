name: Integration Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/lego_command_center_test"

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lego_command_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint Code
        run: npm run lint

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Setup Test Database Schema
        run: npx prisma db push --accept-data-loss

      - name: Seed Test Database
        run: npx prisma db seed

      - name: Run Tests
        run: npm run test

      - name: Build Application
        run: npm run build
